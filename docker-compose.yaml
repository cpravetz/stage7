services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  gateway:
    image: stage7-gateway
    build:
      context: .
      dockerfile: services/gateway/dockerfile
    ports:
      - "3900:3000"
    env_file:
      - .env
    restart: unless-stopped

  brain:
    image: stage7-brain
    build:
      context: .
      dockerfile: services/brain/dockerfile
    ports:
      - "3100:3100"
    env_file:
      - .env
    restart: unless-stopped

  mcp-runtime:
    image: stage7-mcp-runtime
    build:
      context: .
      dockerfile: services/mcp-runtime/dockerfile
    ports:
      - "3300:3300"
    env_file:
      - .env
    restart: unless-stopped

  worker-pool:
    image: stage7-worker-pool
    build:
      context: .
      dockerfile: services/worker-pool/dockerfile
    ports:
      - "3200:3200"
    env_file:
      - .env
    restart: unless-stopped

  temporal:
    image: stage7-temporal
    build:
      context: .
      dockerfile: services/temporal/dockerfile
    ports:
      - "4100:4100"
    env_file:
      - .env
    depends_on:
      - artifacts
      - gateway
    restart: unless-stopped

  vault:
    image: stage7-vault
    build:
      context: .
      dockerfile: services/vault/dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
    restart: unless-stopped

  artifacts:
    image: stage7-artifacts
    build:
      context: .
      dockerfile: services/artifacts/dockerfile
    ports:
      - "4200:4200"
    env_file:
      - .env
    depends_on:
      - redis
      - mongo
    restart: unless-stopped

  auth:
    image: stage7-auth
    build:
      context: .
      dockerfile: services/auth/dockerfile
    ports:
      - "4300:4300"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  agent-runtime:
    image: stage7-agent-runtime
    build:
      context: .
      dockerfile: services/agent-runtime/dockerfile
    ports:
      - "3400:3400"
    env_file:
      - .env
    depends_on:
      - redis
      - artifacts
    restart: unless-stopped

  tool-executor:
    image: stage7-tool-executor
    build:
      context: .
      dockerfile: services/tool-executor/dockerfile
    ports:
      - "3500:3500"
    env_file:
      - .env
    depends_on:
      - redis
      - artifacts
    restart: unless-stopped

  frontend:
    image: stage7-frontend
    build:
      context: .
      dockerfile: frontend-nextgen/dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - gateway
    restart: unless-stopped

  # OpenWebUI is using an external server, not a local container


volumes:
  mongo_data:
  redis_data:
  config_data:
  security_keys:

networks:
  default:
    name: mcs_network

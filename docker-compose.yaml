services:
  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  gateway:
    image: stage7-gateway
    build:
      context: .
      dockerfile: services/gateway/dockerfile
    ports:
      - "3900:3000"
    env_file:
      - .env
    restart: unless-stopped

  brain:
    image: stage7-brain
    build:
      context: .
      dockerfile: services/brain/dockerfile
    ports:
      - "3100:3100"
    env_file:
      - .env
    environment:
      # Documents API service-account credentials, exchanged for a bearer token
      # by the shared service-token client (see auth-bootstrap below).
      - SERVICE_AUTH_ID=${BRAIN_SERVICE_AUTH_ID:-brain}
      - SERVICE_API_KEY=${BRAIN_SERVICE_API_KEY:-}
    depends_on:
      artifacts:
        condition: service_healthy
    restart: unless-stopped

  worker-pool:
    image: stage7-worker-pool
    build:
      context: .
      dockerfile: services/worker-pool/dockerfile
      args:
        # Prunes the image down to the selected assistant folders. Must match the
        # runtime env below, otherwise the container would find fewer folders
        # than STAGE7_ASSISTANTS names and fail validation on boot.
        STAGE7_ASSISTANTS: ${STAGE7_ASSISTANTS}
    ports:
      - "3200:3200"
    env_file:
      - .env
    environment:
      - STAGE7_ASSISTANTS=${STAGE7_ASSISTANTS}
    # Assistant knowledge is persisted in Mongo. worker-pool must not boot
    # before Mongo is accepting connections, or it would fall back to a
    # volatile in-memory store and refuse to start.
    depends_on:
      redis:
        condition: service_started
      mongo:
        condition: service_healthy
    restart: unless-stopped

  temporal:
    image: stage7-temporal
    build:
      context: .
      dockerfile: services/temporal/dockerfile
    ports:
      - "4100:4100"
    env_file:
      - .env
    environment:
      - SERVICE_AUTH_ID=${TEMPORAL_SERVICE_AUTH_ID:-temporal}
      - SERVICE_API_KEY=${TEMPORAL_SERVICE_API_KEY:-}
    depends_on:
      - artifacts
      - gateway
    restart: unless-stopped

  vault:
    image: stage7-vault
    build:
      context: .
      dockerfile: services/vault/dockerfile
    ports:
      - "4000:4000"
    env_file:
      - .env
    restart: unless-stopped

  artifacts:
    image: stage7-artifacts
    build:
      context: .
      dockerfile: services/artifacts/dockerfile
    ports:
      - "4200:4200"
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4200/api/artifacts/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  auth:
    image: stage7-auth
    build:
      context: .
      dockerfile: services/auth/dockerfile
    ports:
      - "4300:4300"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  agent-runtime:
    image: stage7-agent-runtime
    build:
      context: .
      dockerfile: services/agent-runtime/dockerfile
    ports:
      - "3400:3400"
    env_file:
      - .env
    depends_on:
      - redis
      - artifacts
    restart: unless-stopped

  tool-executor:
    image: stage7-tool-executor
    build:
      context: .
      dockerfile: services/tool-executor/dockerfile
    ports:
      - "3500:3500"
    env_file:
      - .env
    environment:
      - STAGE7_ASSISTANTS=${STAGE7_ASSISTANTS}
      - SERVICE_AUTH_ID=${TOOL_EXECUTOR_SERVICE_AUTH_ID:-tool-executor}
      - SERVICE_API_KEY=${TOOL_EXECUTOR_SERVICE_API_KEY:-}
      - TOOL_STORE_DIR=/var/lib/stage7/tool-executor/tools
      - PLUGIN_DEPLOY_DIR=/var/lib/stage7/tool-executor/plugins
    # Generated plugins are validated in an isolated bubblewrap sandbox that
    # calls unshare(CLONE_NEWUSER/CLONE_NEWNET/CLONE_NEWPID). Docker Desktop's
    # LinuxKit kernel suppresses unprivileged user namespaces, and the default
    # seccomp profile blocks the clone flags, so the sandbox fails with
    # "bwrap: Creating new namespace failed: Operation not permitted".
    # Privileged mode restores those namespaces; network isolation is still
    # enforced by bwrap's --unshare-net inside the sandbox.
    privileged: true
    volumes:
      - tool_executor_data:/var/lib/stage7/tool-executor
    depends_on:
      - redis
      - artifacts
    restart: unless-stopped

  auth-bootstrap:
    # One-shot seeding of the documents API service accounts (brain, temporal,
    # tool-executor). The artifacts documents router requires a bearer token;
    # callers exchange SERVICE_AUTH_ID / SERVICE_API_KEY for one at runtime, and
    # this step registers the matching accounts with the auth service. Re-seeding
    # an existing account is refused by auth and ignored here, so the step is
    # safe to run on every stack start.
    image: curlimages/curl:8.10.1
    depends_on:
      - auth
    environment:
      - BRAIN_SERVICE_AUTH_ID=${BRAIN_SERVICE_AUTH_ID:-brain}
      - BRAIN_SERVICE_API_KEY=${BRAIN_SERVICE_API_KEY:-}
      - TEMPORAL_SERVICE_AUTH_ID=${TEMPORAL_SERVICE_AUTH_ID:-temporal}
      - TEMPORAL_SERVICE_API_KEY=${TEMPORAL_SERVICE_API_KEY:-}
      - TOOL_EXECUTOR_SERVICE_AUTH_ID=${TOOL_EXECUTOR_SERVICE_AUTH_ID:-tool-executor}
      - TOOL_EXECUTOR_SERVICE_API_KEY=${TOOL_EXECUTOR_SERVICE_API_KEY:-}
    volumes:
      # The seeding script is mounted, not inlined, so compose's $-interpolation
      # cannot eat the shell variables the script itself expands.
      - ./services/auth/scripts/seed-service-accounts.sh:/seed-service-accounts.sh:ro
    entrypoint: ["sh", "/seed-service-accounts.sh"]
    restart: "no"

  frontend:
    image: stage7-frontend
    build:
      context: .
      dockerfile: frontend-nextgen/dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - gateway
    restart: unless-stopped

  # OpenWebUI is using an external server, not a local container


volumes:
  mongo_data:
  redis_data:
  config_data:
  security_keys:
  tool_executor_data:

networks:
  default:
    name: mcs_network
